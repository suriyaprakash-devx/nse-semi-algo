services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: nse-scanner-backend
    env: python
    region: oregon
    plan: standard
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nse-scanner-postgres
          property: connectionString
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DELETE_RESULTS_AFTER_SCAN
        value: "false"
      - key: SCAN_INTERVAL_MINUTES
        value: "10"
      - key: DEFAULT_TIMEFRAME
        value: "10m"
      - key: DEFAULT_VOLUME_MULTIPLIER
        value: "1.5"
      - key: DEFAULT_VOLUME_LOOKBACK
        value: "20"
      - key: DEFAULT_RISK_REWARD
        value: "2.0"
      - key: MAX_STOCKS
        value: "200"
      - key: MAX_WORKERS
        value: "5"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false

  # 2. React + Vite Frontend Static Site
  - type: static
    name: nse-scanner-frontend
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 3. PostgreSQL Managed Database on Render
  - name: nse-scanner-postgres
    region: oregon
    plan: standard
    databaseName: nse_scanner
    user: scanner_user
